name: Релиз

# Ставишь тег и пушишь его — GitHub собирает подписанный APK и создаёт релиз
# здесь и в публичном molex1le/UniTime (оттуда приложение узнаёт об обновлениях).
# Текст тега = «что нового» для пользователей:
#   git tag -a v3.8 -m "- Починил …" && git push origin v3.8
# Строка [важно] в тексте делает обновление обязательным.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXTPAIR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Нет секрета NEXTPAIR_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NEXTPAIR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Тесты и подписанная сборка
        env:
          NEXTPAIR_STORE_PASSWORD: ${{ secrets.NEXTPAIR_STORE_PASSWORD }}
          NEXTPAIR_KEY_PASSWORD: ${{ secrets.NEXTPAIR_KEY_PASSWORD }}
          NEXTPAIR_KEY_ALIAS: ${{ secrets.NEXTPAIR_KEY_ALIAS }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Версия в теге совпадает с versionName
        run: |
          APK=$(ls app/build/outputs/apk/release/UniTime-*.apk)
          echo "$APK"
          test "$(basename "$APK")" = "UniTime-${GITHUB_REF_NAME#v}.apk" || { echo "Тег $GITHUB_REF_NAME не совпадает с versionName в app/build.gradle.kts"; exit 1; }

      - name: Что нового — из текста тега
        run: |
          git fetch --force --tags
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '/^-----BEGIN/,$d' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then echo "Исправления и улучшения." > "$RUNNER_TEMP/notes.md"; fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Релиз в NextPair
        uses: softprops/action-gh-release@v2
        with:
          name: UniTime ${{ github.ref_name }}
          files: app/build/outputs/apk/release/UniTime-*.apk
          body_path: ${{ runner.temp }}/notes.md

      - name: Релиз в публичном UniTime (для обновлений в приложении)
        env:
          GH_TOKEN: ${{ secrets.UNITIME_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Нет секрета UNITIME_RELEASE_TOKEN — пропускаю"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/UniTime-*.apk \
            -R molex1le/UniTime --title "UniTime ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Удалить ключ с машины сборки
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
